<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le bon de livraison — Contrôle de réception</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM — « Quai de réception » (thème clair)
   Béton clair, carton kraft, bleu encre, jaune de sécurité,
   rouge tampon. L'élément fort : les colis et les documents.
   ============================================================ */
:root{
  --bg:#EBEFF3; --bg2:#F5F7F9; --bg3:#DEE4EB; --card:#FFFFFF;
  --text:#1A2D47; --text2:#475A75; --text3:#7B8AA0; --border:#D3DBE5;
  --accent:#1F4E8C; --accent2:#2E6BC0; --gold:#D9A21B; --safety:#F3C318;
  --orange:#D9731B; --success:#1C8F63; --error:#C9303E;
  --kraft:#C79A62; --kraft2:#AE7F48; --kraft3:#E2C394; --ink:#22408A;
  --radius:14px;
  --okbg:#E6F5EE; --okbd:#9CD3BB; --halfbg:#FDF0E2; --halfbd:#EFC08E; --kobg:#FCEBED; --kobd:#EEA6AE; --selbg:#EAF2FC;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;min-height:100vh}
.mono,code{font-family:'Space Mono',ui-monospace,Menlo,Consolas,monospace}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
b,strong{font-weight:700}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:60;background:var(--card);border-bottom:1px solid var(--border)}
.hud-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;background:none;border:none;padding:0}
.logo{width:36px;height:36px;display:grid;place-items:center;background:var(--safety);border-radius:10px;flex:none}
.logo svg{width:26px;height:26px}
.hudr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--border);font-size:.85rem;font-weight:600;white-space:nowrap}
.pill.btnpill:hover{background:var(--bg3)}
.pill.xp{background:var(--text);color:#fff;border-color:var(--text)}
.pill.who{font-weight:500;color:var(--text2);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.pill.hot{background:#FFF1D6;border-color:#F2C96B;animation:pulse 1s ease-in-out infinite}
.xpwrap{max-width:1180px;margin:0 auto;padding:9px 16px 0;display:flex;align-items:center;gap:12px;font-size:.84rem;color:var(--text2)}
.xprank{font-weight:700;color:var(--text);white-space:nowrap}
.xptrack{position:relative;flex:1;height:10px;background:var(--bg3);border-radius:99px}
.xpfill{height:100%;border-radius:99px;background:repeating-linear-gradient(-45deg,var(--safety) 0 8px,#F8D95E 8px 16px);transition:width .7s ease;min-width:0}
.xpmark{position:absolute;top:-3px;width:3px;height:16px;background:var(--text3);border-radius:2px;transform:translateX(-1px)}
.xpmark.passed{background:var(--text)}
.xpnext{white-space:nowrap}
.navdots{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ndot{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:var(--card);font-weight:700;font-size:.82rem;display:grid;place-items:center}
.ndot.done{background:var(--success);border-color:var(--success);color:#fff}
.ndot.cur{border-color:var(--text);box-shadow:0 0 0 3px var(--safety)}
.ndot.locked{opacity:.45;cursor:not-allowed}
main{padding:18px 16px 70px}
.wrap{max-width:1180px;margin:0 auto}
.narrow{max-width:800px;margin:0 auto}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;border:2px solid var(--text);background:var(--text);color:#fff;font-weight:700;font-size:1rem;transition:transform .12s,background .15s,opacity .15s;text-align:center}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#26446E}
.btn:disabled{opacity:.38}
.btn.yellow{background:var(--safety);border-color:var(--safety);color:var(--text)}
.btn.yellow:hover:not(:disabled){background:#FFD53D}
.btn.ghost{background:var(--card);color:var(--text);border-color:var(--border)}
.btn.ghost:hover:not(:disabled){background:var(--bg2);border-color:var(--text3)}
.btn.red{color:var(--error);border-color:#EFBFC4;background:var(--card)}
.btn.red:hover:not(:disabled){background:var(--kobg)}
.btn.sm{padding:7px 12px;font-size:.88rem;border-radius:9px}
.btn.lbapp{background:var(--card);color:var(--success);border-color:var(--success)}
.btn.lbglob{background:var(--card);color:var(--orange);border-color:var(--orange)}
.linkbtn{background:none;border:none;color:var(--text2);text-decoration:underline;font-size:.85rem;padding:4px}
.linkbtn:hover{color:var(--error)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* ---------- Accueil ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:40px 40px 52px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(-45deg,var(--safety) 0 18px,var(--text) 18px 36px)}
.course{font-size:.92rem;color:var(--text3);margin-bottom:10px}
.hero h1{font-size:clamp(2.3rem,5.4vw,3.9rem);line-height:1;font-weight:800;letter-spacing:-.025em}
.hero .lead{font-size:1.14rem;color:var(--text2);margin:16px 0 22px;max-width:32em}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.stat{padding:6px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);font-size:.92rem}
.stat b{font-weight:800}
.heroart{position:relative}
.heroart svg{width:100%;height:auto;display:block}
.herostamp{position:absolute;right:4%;top:56%;color:var(--ink);border:4px double currentColor;border-radius:8px;padding:6px 12px;font-weight:800;letter-spacing:.08em;font-size:1rem;background:rgba(255,255,255,.55);transform:rotate(-9deg);animation:stampIn .55s .6s both cubic-bezier(.2,1.5,.4,1)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.how div{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.how b{display:block;margin-bottom:2px}
.how span{color:var(--text2);font-size:.94rem}

/* ---------- Parcours ---------- */
.hubhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.hubhead h2{font-size:1.6rem}
.hubhead p{color:var(--text2)}
.path{position:relative;padding:6px 0;margin-bottom:26px}
.path::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;border-left:3px dashed #BFC9D6;transform:translateX(-50%)}
.pstep{position:relative;display:flex;align-items:center;min-height:96px;margin:10px 0}
.pnode{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--card);border:3px solid var(--border);display:grid;place-items:center;font-weight:800;z-index:2}
.pnode.done{background:var(--success);border-color:var(--success);color:#fff}
.pnode.next{border-color:var(--text);background:var(--safety);animation:pulse 1.8s ease-in-out infinite}
.pnode.locked{color:var(--text3)}
.pcard{width:calc(50% - 48px);background:var(--card);border:2px solid var(--border);border-radius:16px;padding:14px 16px;text-align:left;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,transform .15s}
.pstep.right .pcard{margin-left:auto}
.pcard:hover:not(:disabled){border-color:var(--text);transform:translateY(-2px)}
.pcard:disabled{opacity:.55}
.pcard .pic{font-size:1.9rem;line-height:1}
.pcard small{color:var(--text3);display:block}
.pcard h3{font-size:1.08rem;line-height:1.2}
.pcard p{font-size:.88rem;color:var(--text2)}
.pcard .pmeta{margin-top:6px;font-size:.85rem;font-weight:600;color:var(--text)}
.stars{color:var(--gold);letter-spacing:1px}
.section-t{font-size:1.2rem;margin:22px 0 10px}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.troph{border:1px solid var(--border);border-radius:14px;padding:12px 10px;text-align:center;background:var(--card)}
.troph .ti{font-size:1.8rem;display:block}
.troph b{display:block;font-size:.92rem;margin:2px 0}
.troph small{color:var(--text2);font-size:.78rem;line-height:1.25;display:block}
.troph.off{background:var(--bg2)}
.troph.off .ti{filter:grayscale(1);opacity:.4}
.troph.off b{color:var(--text3)}

/* ---------- Briefing ---------- */
.bhead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.bhead .bic{font-size:2.4rem}
.bhead small{color:var(--text3)}
.bhead h2{font-size:1.6rem;line-height:1.1}
.bmeta{color:var(--text2);margin-bottom:12px}
.box{border-radius:14px;padding:14px 16px;margin:12px 0;border:1px solid var(--border);background:var(--card)}
.box h4{font-size:1rem;margin-bottom:6px}
.box ul{margin-left:20px}
.box li{margin:2px 0}
.box.obj{border-left:6px solid var(--accent2)}
.box.ex{background:#FFF3E5;border-color:#F1C79B}
.box.plus{background:#FFF8DD;border-color:#E8CF78}
.box.synth{background:var(--text);color:#fff;border-color:var(--text)}
.box p+p{margin-top:8px}
.predict{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pred{border:2px solid var(--border);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:600}
.pred:hover{border-color:var(--text3)}
.pred.sel{border-color:var(--text);background:var(--safety)}

/* ---------- Question ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.qtitle{display:flex;align-items:center;gap:10px}
.qtitle small{color:var(--text3);display:block}
.qtitle h2{font-size:1.3rem;line-height:1.15}
.qic{font-size:1.9rem;line-height:1}
.qdots{display:flex;gap:6px}
.qd{width:15px;height:15px;border-radius:50%;background:var(--bg3);border:2px solid var(--border)}
.qd.correct{background:var(--success);border-color:var(--success)}
.qd.hint{background:var(--orange);border-color:var(--orange)}
.qd.shown{background:var(--error);border-color:var(--error)}
.qd.cur{background:var(--gold);border-color:var(--gold)}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px}
.qcard.rec{background:transparent;border:0;padding:0}
.qtag{display:inline-block;font-size:.82rem;color:var(--text2);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:3px 10px;margin-bottom:12px}
.qcard.rec .qtag{background:var(--card)}
.prompt{font-size:1.1rem;font-weight:600;margin-bottom:14px}
.data{display:block;background:var(--bg2);border:1px dashed #BCC7D5;border-radius:10px;padding:10px 12px;margin:0 0 14px}
.shake{animation:shake .45s}

/* ---------- Réception : scène, quai, colis ---------- */
.scene{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.scene-ic{font-size:1.9rem;line-height:1}
.scene p{color:var(--text2)}
.quai{position:relative;background:#E0E6EC;border-radius:16px;padding:24px 16px 16px;margin-bottom:20px;overflow:hidden}
.quai::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(-45deg,var(--safety) 0 14px,var(--text) 14px 28px)}
.quai-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.quai-head h3{font-size:1.12rem}
.quai-head span{color:var(--text2);font-size:.9rem}
.parcels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.parcel{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:214px}
.parcel.open{border-color:#B7C4D4}
.parcel.refused{border-color:var(--error);background:#FFF7F7}
.parcel.lok{border-color:var(--success)}
.parcel.lhalf{border-color:var(--orange)}
.ptop{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:.9rem}
.pstate{color:var(--text2);font-size:.82rem}
.parcel.damaged .pstate{color:var(--error);font-weight:600}
.pbox{position:relative;display:grid;place-items:center;flex:1}
.pbox svg{width:140px;height:auto}
.refstamp{position:absolute;color:var(--error);border:3px double currentColor;border-radius:6px;padding:2px 10px;font-weight:800;letter-spacing:.1em;transform:rotate(-12deg);background:rgba(255,255,255,.7);animation:stampIn .4s cubic-bezier(.2,1.5,.4,1)}
.pact{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.popen{display:flex;flex-direction:column;gap:6px;flex:1}
.popen svg{width:74px;height:auto;align-self:center}
.plist{list-style:none;display:flex;flex-direction:column;gap:6px}
.plist li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--bg2);border-radius:10px;padding:6px 8px;animation:pop .25s ease}
.pem{font-size:1.3rem;text-align:center}
.pdes{font-size:.86rem;line-height:1.25}
.pdes code{display:block;font-size:.72rem;color:var(--text3)}
.pq{font-family:'Space Mono',monospace;font-weight:700;font-size:1.02rem;background:var(--text);color:#fff;border-radius:8px;padding:2px 8px;white-space:nowrap}
.pnote{font-size:.84rem;color:var(--error);font-weight:600}
.pmark{font-size:.84rem;font-weight:700;text-align:center;border-radius:8px;padding:4px 6px}
.pmark.ok{color:var(--success);background:var(--okbg)}
.pmark.half{color:var(--orange);background:var(--halfbg)}
.pmark.ko{color:var(--error);background:var(--kobg)}
.pmark.fa{color:var(--text2);background:var(--bg2)}

/* ---------- Réception : documents ---------- */
.docs{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.doclabel{font-weight:700;margin:0 0 6px 4px;font-size:.98rem}
.doclabel small{font-weight:400;color:var(--text3)}
.doc{position:relative;background:#fff;border:1px solid #D8DFE8;border-radius:4px;padding:18px;box-shadow:0 2px 0 #E1E6EC,0 12px 26px rgba(26,45,71,.07);font-size:.88rem;line-height:1.4}
.dhead{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--text);padding-bottom:10px;margin-bottom:10px}
.demit{display:flex;flex-direction:column}
.demit b{font-size:1rem}
.demit .tva{font-family:'Space Mono',monospace;font-size:.74rem;color:var(--text3)}
.dtitle{text-align:right;display:flex;flex-direction:column}
.dtitle h4{font-size:1rem;letter-spacing:.06em}
.dtitle .mono{font-size:.82rem}
.dto{display:flex;flex-direction:column;margin:0 0 10px auto;width:fit-content;min-width:58%;border-left:3px solid var(--text);background:var(--bg2);padding:7px 10px}
.dlab{color:var(--text3);font-size:.75rem}
.dref{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px;font-size:.86rem}
.dtab{width:100%;border-collapse:collapse;margin-bottom:10px;table-layout:fixed}
.dtab th.wq{width:64px}
.dtab th.wp{width:80px}
tr.hasnote td{border-bottom:0;padding-bottom:2px}
tr.noterow td{padding:0 8px 8px}
tr.noterow .znote{margin-top:0}
.dtab th{background:var(--text);color:#fff;font-weight:600;font-size:.78rem;text-align:left;padding:6px 8px}
.dtab td{border-bottom:1px solid #E6EBF1;padding:6px 8px;vertical-align:top}
.dtab .r{text-align:right;white-space:nowrap}
.dtab code{font-size:.78rem}
.dtab .refc{display:block;font-size:.76rem;color:var(--text2)}
.dcond{display:block;background:var(--bg2);padding:8px 10px;border-radius:6px;margin-bottom:10px}
.dupli{align-self:flex-end;display:inline-block;margin-top:4px;transform:rotate(-4deg);color:#8E9BAD;border:2px solid currentColor;border-radius:5px;padding:0 8px;font-weight:800;font-size:.72rem;letter-spacing:.12em}

/* Zones cliquables du BL */
.zone{display:block;width:100%;text-align:inherit;background:transparent;border:1px dashed transparent;border-radius:6px;padding:3px 22px 3px 5px;margin:-3px -5px;position:relative;font:inherit;color:inherit;line-height:inherit;width:calc(100% + 10px)}
.zone.inl{display:inline-block;width:auto;margin:-3px 0}
.zone:hover:not(:disabled){border-color:var(--accent2);background:var(--selbg)}
.zone:not(:disabled)::after{content:"✎";position:absolute;right:5px;top:3px;color:#A9B6C7;font-size:.82rem}
.zone:hover:not(:disabled)::after{color:var(--accent2)}
.zone:disabled{cursor:default}
.zone.flag{background:var(--kobg);border:1px solid var(--kobd)}
.zone.flag::after{content:"!";color:#fff;background:var(--error);border-radius:50%;width:16px;height:16px;display:grid;place-items:center;font-size:.72rem;font-weight:800;top:4px}
.zone.editing{border:2px solid var(--accent2);background:var(--selbg)}
.zone.ok{background:var(--okbg);border:1px solid var(--okbd)}
.zone.half{background:var(--halfbg);border:1px solid var(--halfbd)}
.zone.ko{background:var(--kobg);border:1px dashed var(--error)}
.zone.fa{background:repeating-linear-gradient(-45deg,#F4F6F9 0 6px,#EAEEF3 6px 12px);border:1px dashed var(--text3)}
.dto .zone,.dcond .zone{padding:4px 24px 4px 6px}
.znote{display:block;font-size:.8rem;font-weight:600;margin-top:3px;line-height:1.25}
.znote.flag{color:var(--error)}
.znote.ok{color:var(--success)}
.znote.half{color:var(--orange)}
.znote.ko{color:var(--error)}
.znote.fa{color:var(--text2)}

/* Éditeur de réserve */
.editor{background:#F2F7FD;border:2px solid var(--accent2);border-radius:10px;padding:10px 12px;margin:6px 0 10px;animation:pop .18s ease;text-align:left}
.edq{font-weight:700;margin-bottom:6px;font-size:.92rem}
.edopts{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.edopt{text-align:left;background:#fff;border:2px solid var(--border);border-radius:9px;padding:7px 10px;font-size:.88rem}
.edopt:hover{border-color:var(--accent2)}
.edopt.sel{border-color:var(--accent2);background:#E1ECFA;font-weight:600}
.edqty{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;font-weight:600}
.edqty input{width:120px;padding:7px 10px;border:2px solid var(--border);border-radius:8px;font-family:'Space Mono',monospace;font-size:1rem;background:#fff;color:var(--text)}
.edqty input:focus{border-color:var(--accent2);outline:none}
.calc{font-family:'Space Mono',monospace;font-size:.85rem;color:var(--accent);min-height:1.3em;margin:4px 0 6px}
.edbtns{display:flex;gap:6px;flex-wrap:wrap}
tr.edrow td{border-bottom:0;padding:0 4px}

/* Cadre de réception, réserves manuscrites, cachets */
.cadre{border:2px dashed #C6D0DC;border-radius:10px;padding:10px 12px;margin-top:4px;position:relative}
.cadre-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--text3);margin-bottom:6px}
.cadre-h b{color:var(--text)}
.reserves{list-style:none;font-family:'Caveat',cursive;font-size:1.32rem;line-height:1.12;color:var(--ink);display:flex;flex-direction:column;gap:3px;min-height:34px}
.reserves .empty{font-family:'Outfit',sans-serif;font-size:.85rem;color:var(--text3);font-style:italic}
.reserves li.new{animation:write .7s ease}
.reserves .rk{font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:700;margin-left:6px;vertical-align:middle}
.reserves li.ok .rk{color:var(--success)}
.reserves li.half .rk{color:var(--orange)}
.reserves li.ko{color:var(--error)}
.reserves li.ko .rk{color:var(--error)}
.reserves li.fa{text-decoration:line-through;color:#98A4B5}
.reserves li.fa .rk{color:var(--text2);text-decoration:none;display:inline-block}
.stampbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:.85rem}
.stampbar>span{color:var(--text2);font-weight:600;margin-right:2px}
.stampbtn{border:2px solid currentColor;background:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:.82rem}
.stampbtn.s-sans{color:var(--success)}
.stampbtn.s-reserve{color:var(--ink)}
.stampbtn.s-refus{color:var(--error)}
.stampbtn.sel.s-sans{background:var(--okbg)}
.stampbtn.sel.s-reserve{background:#E3E9F7}
.stampbtn.sel.s-refus{background:var(--kobg)}
.stamprow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:10px;min-height:52px}
.stamp{display:inline-block;border:4px double currentColor;border-radius:7px;padding:4px 12px;font-weight:800;letter-spacing:.07em;transform:rotate(-7deg);font-size:.95rem;background:rgba(255,255,255,.6);text-transform:uppercase}
.stamp.s-sans{color:var(--success)}
.stamp.s-reserve{color:var(--ink)}
.stamp.s-refus{color:var(--error)}
.stamp.anim{animation:stampIn .45s cubic-bezier(.2,1.5,.4,1)}
.stamp.wrongst{opacity:.45;text-decoration:line-through}
.stamp.expect{border-style:dashed;border-width:3px}
.stampnote{font-size:.8rem;font-weight:700;display:block;margin-top:14px}
.sign{text-align:right;font-size:.78rem;color:var(--text3)}
.hand{font-family:'Caveat',cursive;font-size:1.45rem;color:var(--ink);display:block;line-height:1}

/* Barre d'action collante */
.recbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:2px solid var(--text);border-radius:14px;padding:10px 14px;margin-top:20px;position:sticky;bottom:12px;z-index:30}
.recstat{display:flex;gap:6px;flex-wrap:wrap;font-size:.88rem}
.recstat span{padding:4px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--border)}
.recstat span.ok{background:var(--okbg);border-color:var(--okbd)}

/* ---------- Autres formats ---------- */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--border);background:var(--card);font-size:1rem;width:100%}
.opt:hover:not(:disabled){border-color:var(--text3)}
.opt .ol{font-family:'Space Mono',monospace;font-weight:700;color:var(--text3);flex:none;width:18px}
.opt.sel{border-color:var(--accent2);background:var(--selbg)}
.opt.good{border-color:var(--success);background:var(--okbg)}
.opt.bad{border-color:var(--error);background:var(--kobg)}
.opt.miss{border:2px dashed var(--success)}
.opt:disabled{cursor:default}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf .opt{justify-content:center;font-weight:700;font-size:1.08rem}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--text3);display:grid;place-items:center;flex:none;font-size:.8rem;font-weight:800;background:#fff}
.opt.sel .chk{background:var(--accent2);border-color:var(--accent2);color:#fff}
.slots{display:flex;flex-direction:column;gap:6px;margin:4px 0 14px}
.slot{display:flex;align-items:center;gap:10px;min-height:48px;border:2px dashed #BCC7D5;border-radius:10px;padding:6px 10px;background:var(--bg2);text-align:left;width:100%}
.slot .sn{width:28px;height:28px;border-radius:50%;background:var(--text);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.slot.filled{border-style:solid;border-color:var(--border);background:var(--card)}
.slot.ok{border:2px solid var(--success);background:var(--okbg)}
.slot.half{border:2px solid var(--orange);background:var(--halfbg)}
.slot.ko{border:2px solid var(--error);background:var(--kobg)}
.slot .ph{color:var(--text3);font-style:italic;font-size:.9rem}
.pooltitle{font-size:.86rem;color:var(--text2);font-weight:600;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--border);background:var(--card);border-radius:10px;padding:8px 12px;text-align:left;font-size:.93rem;line-height:1.3}
.chip:hover:not(:disabled){border-color:var(--text3)}
.chip.sel{border-color:var(--accent2);background:var(--selbg);box-shadow:0 0 0 3px #CFE0F7}
.chip.ok{border-color:var(--success);background:var(--okbg)}
.chip.half{border-color:var(--orange);background:var(--halfbg)}
.chip.ko{border-color:var(--error);background:var(--kobg)}
.chip:disabled{cursor:default}
.bounce{animation:bounce .5s}
.corr{display:block;font-size:.82rem;color:var(--error);font-weight:700;margin-top:2px}
.zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.zbox{border:2px dashed #BCC7D5;border-radius:12px;padding:10px;min-height:130px;background:var(--bg2);text-align:left;display:flex;flex-direction:column;gap:6px;align-items:stretch;width:100%}
.zbox h5{font-size:.9rem;font-weight:700}
.zbox.target{border-color:var(--accent2);background:var(--selbg)}
.zbox .chip{width:100%}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--card)}
.mrow select{width:100%;padding:9px;border-radius:9px;border:2px solid var(--border);font:inherit;font-size:.92rem;background:#fff;color:var(--text)}
.mrow.ok{border-color:var(--success);background:var(--okbg)}
.mrow.half{border-color:var(--orange);background:var(--halfbg)}
.mrow.ko{border-color:var(--error);background:var(--kobg)}

/* ---------- Feedback ---------- */
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.96rem}
.fb.ok{background:var(--okbg);border:1px solid var(--okbd)}
.fb.warn{background:var(--halfbg);border:1px solid var(--halfbd)}
.fb.ko{background:var(--kobg);border:1px solid var(--kobd)}
.fb.info{background:var(--bg2);border:1px solid var(--border)}
.fb h4{font-size:1rem;margin-bottom:4px}
.fb ul{margin:6px 0 0 20px}
.fb li{margin:2px 0}
.fb p+p{margin-top:6px}
.nextbar{display:flex;justify-content:flex-end;margin-top:14px}

/* ---------- Bilans ---------- */
.bil{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px}
.bilhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.medal{font-size:3.6rem;line-height:1}
.grade{display:inline-block;background:var(--text);color:#fff;border-radius:10px;padding:2px 12px;font-weight:800;margin-right:6px}
.bilhead h2{font-size:1.5rem;line-height:1.15}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--text2);margin:14px 0 8px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.dot.g{background:var(--success)}.dot.o{background:var(--orange)}.dot.r{background:var(--error)}
.btable{width:100%;border-collapse:collapse;font-size:.93rem}
.btable th{text-align:left;font-size:.8rem;color:var(--text2);font-weight:600;border-bottom:2px solid var(--border);padding:6px}
.btable td{border-bottom:1px solid var(--border);padding:7px 6px}
.btable .c{text-align:center}
.btable .r{text-align:right;white-space:nowrap}
.predline{background:var(--bg2);border-radius:12px;padding:10px 14px;margin:14px 0}
.artefact{margin-top:18px}
.artefact .doc{max-width:640px}
.crit{border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--card)}
.crit.atteint{border-left:7px solid var(--success)}
.crit.encours{border-left:7px solid var(--orange)}
.crit.nonatteint{border-left:7px solid var(--error)}
.crit h4{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:1rem;margin-bottom:6px}
.badge-st{font-size:.82rem;font-weight:700;border-radius:99px;padding:2px 10px}
.badge-st.atteint{background:var(--okbg);color:var(--success)}
.badge-st.encours{background:var(--halfbg);color:var(--orange)}
.badge-st.nonatteint{background:var(--kobg);color:var(--error)}
.ind{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:.94rem}
.rev{font-size:.88rem;color:var(--text2);margin:0 0 6px 28px;background:var(--bg2);border-radius:8px;padding:6px 10px}
.allok{background:var(--okbg);border:1px solid var(--okbd);border-radius:12px;padding:10px 14px;margin-top:8px}
.finalgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.fstat{background:var(--bg2);border-radius:12px;padding:10px;text-align:center}
.fstat b{display:block;font-size:1.3rem}
.fstat small{color:var(--text2)}

/* ---------- Modals et effets ---------- */
.overlay{position:fixed;inset:0;z-index:9000;background:rgba(15,25,40,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.mcard{position:relative;background:var(--card);border-radius:20px;padding:30px 28px;max-width:440px;width:100%;text-align:center;animation:slideUp .35s ease;overflow:hidden}
.mcard .rays{position:absolute;left:50%;top:38%;width:560px;height:560px;margin:-280px 0 0 -280px;background:repeating-conic-gradient(rgba(243,195,24,.22) 0 12deg,transparent 12deg 24deg);animation:spin 14s linear infinite;pointer-events:none}
.mcard>*{position:relative}
.mcard .rk{font-size:4rem;line-height:1;animation:pop .5s ease}
.mcard h3{font-size:1.5rem;margin:8px 0 4px}
.mcard p{color:var(--text2);margin-bottom:16px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:9200;background:var(--text);color:#fff;border-radius:14px;padding:12px 18px;display:flex;gap:12px;align-items:center;max-width:92vw;animation:toastIn .35s ease;border-bottom:4px solid var(--safety)}
.toast .ti{font-size:1.8rem}
.toast small{display:block;color:#C9D3E0}
.toast.out{animation:toastOut .3s ease forwards}
.particle{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:9500;animation:part .8s ease-out forwards}
.floatxp{position:fixed;z-index:9500;pointer-events:none;font-weight:800;color:var(--success);font-size:1.15rem;animation:floatup 1s ease-out forwards;transform:translate(-50%,-50%);text-shadow:0 1px 0 #fff}
.combo{position:fixed;top:32%;left:50%;z-index:9400;pointer-events:none;font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;color:var(--text);background:var(--safety);padding:6px 22px;border-radius:14px;animation:combo 1.1s ease forwards}
.confetti{position:fixed;top:-14px;width:9px;height:14px;z-index:9300;pointer-events:none;animation:fall linear forwards}
#emailOverlay .mcard input{width:100%;padding:12px 16px;border-radius:10px;border:2px solid var(--border);background:var(--bg2);color:var(--text);font-size:1rem;outline:none;margin-bottom:12px;font-family:inherit}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.pnode.next{animation-name:pulsenode}
@keyframes pulsenode{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}
@keyframes stampIn{0%{transform:rotate(-7deg) scale(1.9);opacity:0}70%{opacity:1}100%{transform:rotate(-7deg) scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes bounce{0%{transform:translateY(0)}30%{transform:translateY(-10px)}60%{transform:translateY(2px)}100%{transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes toastOut{to{transform:translate(-50%,-30px);opacity:0}}
@keyframes part{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes floatup{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(-50%,-140%);opacity:0}}
@keyframes combo{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* ---------- Responsive ---------- */
@media (max-width:960px){.docs{grid-template-columns:1fr}}
@media (max-width:768px){
  .hero{grid-template-columns:1fr;padding:26px 22px 40px}
  .heroart{max-width:360px;margin:0 auto}
  .how{grid-template-columns:1fr}
  .zgrid{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr}

}
@media (max-width:480px){

  .vf{grid-template-columns:1fr}
  .parcels{grid-template-columns:1fr}
  .doc{padding:12px}
  .dto{min-width:100%}
  main{padding:14px 10px 60px}
}

/* ---------- Accessibilité et impression ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media print{
  body *{visibility:hidden}
  .fiche,.fiche *{visibility:visible}
  .fiche{position:absolute;left:0;top:0;width:100%;border:none!important;box-shadow:none!important}
  .noprint{display:none!important}
}

/* Éléments notés d'une question à éléments (barème par élément, §3.8) */
function elemDefs(Q){
  if (Q.type === 'reception'){
    const C = CASES[Q.case]; const els = recEls(C);
    return els.map(e => ({ ind:e.ind, max:Q.pts / els.length }));
  }
  if (Q.type === 'order') return Q.items.map(() => ({ ind:Q.ind, max:Q.pts / Q.items.length }));
  if (Q.type === 'zones') return Q.items.map(it => ({ ind:it.ind, max:Q.pts / Q.items.length }));
  if (Q.type === 'match') return Q.pairs.map(() => ({ ind:Q.ind, max:Q.pts / Q.pairs.length }));
  return null;
}
function recEls(C){ return C.expected.concat([{ zone:'decision', ind:'I5' }]); }

function shuffled(n, seed){
  const a = [...Array(n).keys()]; let s = seed;
  for (let i = n - 1; i > 0; i--){ s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* Mini-calculatrice (CONVENTIONS §6.1) */
function evalExpr(s){
  let e = String(s).replace(/\s|\u00a0|€/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.');
  if (!/^[0-9+\-*/().]+$/.test(e) || !/[+\-*/]/.test(e.slice(1))) return null;
  try { const r = Function('"use strict";return (' + e + ')')(); return (typeof r === 'number' && isFinite(r)) ? r : null; }
  catch(err){ return null; }
}
function parseNum(s){
  const r = evalExpr(s); if (r !== null) return r;
  let t = String(s).replace(/\s|\u00a0|€/g,'');
  if (t.includes(',')) t = t.replace(/\./g,'').replace(',', '.');
  else if ((t.match(/\./g) || []).length > 1) t = t.replace(/\./g,'');
  return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN;
}
function calcPreview(s){
  const r = evalExpr(s || ''); if (r === null) return '';
  const pretty = String(s).replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\+/g,' + ').replace(/(\d)-/g,'$1 − ');
  return esc(pretty) + ' → = ' + fmt(Math.round(r * 100) / 100);
}

/* Carton isométrique dessiné en SVG */
function isoPts(a){ return a.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '); }
function isoBox(cx, y, w, h, o){
  o = o || {}; const k = 0.4;
  const N=[cx,y], E=[cx+w,y+w*k], Sx=[cx,y+2*w*k], W=[cx-w,y+w*k];
  const Sb=[Sx[0],Sx[1]+h], Wb=[W[0],W[1]+h], Eb=[E[0],E[1]+h];
  const st = 'stroke="#946A39" stroke-width="1.2" stroke-linejoin="round"';
  const t = w * 0.09, d = [-t, t*k];

  let s = '';

    s += `<polygon points="${isoPts([W,Sx,Sb,Wb])}" fill="#C79A62" ${st}/>`;
    s += `<polygon points="${isoPts([Sx,E,Eb,Sb])}" fill="#AE7F48" ${st}/>`;

  }
  if (o.damaged){
    const Ed = [E[0]-w*.14, E[1]+h*.1];
    s += `<polygon points="${isoPts([N,Ed,Sx,W])}" fill="#DDBE8D" ${st}/>`;
    s += `<polygon points="${isoPts([W,Sx,Sb,Wb])}" fill="#C79A62" ${st}/>`;
    s += `<polygon points="${isoPts([Sx,Ed,[E[0]-w*.03,E[1]+h*.42],[E[0]-w*.17,E[1]+h*.56],[E[0],E[1]+h*.76],Eb,Sb])}" fill="#A0723E" ${st}/>`;
    s += `<polyline points="${isoPts([Ed,[E[0]-w*.17,E[1]+h*.56],[Sx[0]+w*.35,Sx[1]+h*.2]])}" fill="none" stroke="#6F4A22" stroke-width="1.5"/>`;

    s += `<polygon points="${isoPts([[m1[0]-d[0],m1[1]-d[1]],[m1[0]+d[0],m1[1]+d[1]],[m15[0]+d[0],m15[1]+d[1]],[m15[0]-d[0],m15[1]-d[1]]])}" fill="#F3E6CC" opacity=".9"/>`;
    s += `<polygon points="${isoPts([[m15[0],m15[1]],[m15[0]+w*.16,m15[1]-h*.24],[m15[0]+w*.22,m15[1]-h*.1]])}" fill="#F3E6CC" stroke="#CDB58A"/>`;
    const lx = W[0]+w*.16, ly = W[1]+w*.16*k+h*.18;
    s += `<polygon points="${isoPts([[lx,ly],[lx+w*.42,ly+w*.42*k],[lx+w*.42,ly+w*.42*k+h*.26],[lx,ly+h*.26]])}" fill="#fff" stroke="#C9303E"/>`;
    s += `<text x="${lx+w*.21}" y="${ly+w*.21*k+h*.17}" font-size="${h*.13}" font-weight="800" fill="#C9303E" text-anchor="middle" font-family="Outfit,sans-serif" transform="rotate(21.8 ${lx+w*.21} ${ly+w*.21*k+h*.17})">FRAGILE</text>`;
    return s;
  }
  s += `<polygon points="${isoPts([N,E,Sx,W])}" fill="#E2C394" ${st}/>`;
  s += `<polygon points="${isoPts([W,Sx,Sb,Wb])}" fill="#C79A62" ${st}/>`;
  s += `<polygon points="${isoPts([Sx,E,Eb,Sb])}" fill="#AE7F48" ${st}/>`;

function qTag(Q){
  return ({
    reception:`Contrôle de réception — 2 vérifications · ${Q.pts} XP · fausse alerte −1 XP`,
    qcm:`QCM — 2 essais · ${Q.pts} XP`, vf:`Vrai ou faux — 1 essai · ${Q.pts} XP`,

    zones:`Classement — 2 vérifications · ${Q.pts} XP`, match:`Appariement — 2 vérifications · ${Q.pts} XP`
  })[Q.type];
}
function qDots(l,q){
  return `<div class="qdots" aria-label="Progression dans le cas">` + LEVELS[l].questions.map((Q,i) => {
    const st = APP.qs[l + '_' + i]; const c = st && st.done ? st.status : (i === q ? 'cur' : '');
    return `<span class="qd ${c}"></span>`;
  }).join('') + `</div>`;
}
function renderQuestion(l,q){
  const L = LEVELS[l], Q = getQ(l,q), st = S(l,q), wide = Q.type === 'reception';
  let h = `<div class="${wide ? 'wrap' : 'narrow'}"><div class="qhead"><div class="qtitle"><span class="qic">${L.icon}</span><div><small>Cas ${l+1} sur ${LEVELS.length}, question ${q+1} sur ${L.questions.length}</small><h2>${L.title}</h2></div></div>${qDots(l,q)}</div>`;

/* Fin d'une question : score, série, effets, badges (§4.7 à §4.9) */
function finishQuestion(l,q,status,earned){
  const st = S(l,q); if (st.done) return;
  st.done = true; st.status = status; st.earned = earned;
  const before = APP.score; APP.score += earned;
  if (status === 'correct'){ APP.streak++; APP.bestStreak = Math.max(APP.bestStreak, APP.streak); } else APP.streak = 0;
  if (earned > 0){ particles(APP.lastXY.x, APP.lastXY.y); floatXP(APP.lastXY.x, APP.lastXY.y, '+' + fmt(earned) + ' XP'); sfx('good'); }
  else sfx('bad');
  if (status === 'correct' && APP.streak >= 3) comboFlash(APP.streak);
  const r0 = rankIdx(before), r1 = rankIdx(APP.score);
  for (let r = r0 + 1; r <= r1; r++) showRankUp(r);
  checkBadges();
  renderScreen();
  scrollToFb();
}
/* Barème par élément commun à tous les exercices à éléments (§3.8) */
function elemFinish(st, pts){
  const n = st.lock.length, each = pts / n;
  st.elemEarned = st.lock.map(x => x === 'ok' ? each : x === 'half' ? each / 2 : 0);
  const sum = st.elemEarned.reduce((a,b) => a + b, 0);
  const earned = Math.max(0, sum - (st.penalties || 0));
  const allOk = st.lock.every(x => x === 'ok'), noKo = !st.lock.includes('ko');
  return { status:(allOk && !st.penalties) ? 'correct' : (noKo ? 'hint' : 'shown'), earned };
}

function recInit(st, C){
  if (st.parcels) return;
  st.parcels = C.parcels.map(() => 'closed'); st.flags = {}; st.decision = null; st.editing = null;
  st.draftNature = null; st.draftQty = ''; st.penalties = 0; st.faLog = {}; st.lock = recEls(C).map(() => null);
}
function expIdx(C, z){ return C.expected.findIndex(e => e.zone === z); }
function decIdx(C){ return C.expected.length; }
function isLk(x){ return x === 'ok' || x === 'half'; }
function zoneOrder(C){ const z = ['dest','num','colis']; C.bl.lines.forEach((L,i) => { z.push('art_' + i, 'qty_' + i); }); z.push('cond'); return z; }
function zoneLabel(C, z){
  const p = z.split('_'); const L = p[1] != null ? C.bl.lines[+p[1]] : null;
  return ({ dest:'le destinataire', num:'le numéro de commande', colis:'le nombre de colis', cond:'les conditions', art:'l\'article ' + (L ? L.ref : ''), qty:'la quantité de ' + (L ? L.ref : '') })[p[0]];
}
function reserveText(C, z, f){
  if (!f) return '';
  const p = z.split('_'), L = p[1] != null ? C.bl.lines[+p[1]] : null, n = f.qty != null ? fmt(f.qty) : '';
  switch (f.nature){
    case 'art_recu': return `${L.short} (${L.ref}) : l'article reçu ne correspond pas au BL`;
    case 'art_bc':   return `${L.short} (${L.ref}) : l'article du BL n'est pas celui commandé`;
    case 'qty_recu': return `${L.short} : quantité reçue ${n} au lieu de ${L.qty} (BL)`;
    case 'qty_bc':   return `${L.short} : quantité livrée ${L.qty} au lieu de ${n} (commande)`;
    case 'cond':     return `Conditions du BL non conformes à la commande`;
    case 'dest':     return `Destinataire du BL incorrect`;
    case 'num':      return `Numéro de commande du BL incorrect`;
    case 'colis':    return `${n} colis reçu(s) au lieu de ${C.bl.colis} (BL)`;
  }
  return '';
}
function recRight(st, C, e){
  if (e.zone === 'decision') return st.decision === C.decision;
  if (e.zone.indexOf('parcel_') === 0) return st.parcels[+e.zone.split('_')[1]] === 'refused';
  const f = st.flags[e.zone]; if (!f || f.nature !== e.nature) return false;
  if (e.qty != null) return f.qty != null && Math.abs(f.qty - e.qty) < 0.02;
  return true;
}
function recReady(st){ return st.parcels.every(p => p !== 'closed') && !!st.decision; }

function renderReception(l,q,Q,st){
  const C = CASES[Q.case]; recInit(st, C);
  let h = `<div class="scene"><span class="scene-ic">${C.icon}</span><div><p>${C.intro}</p>`;
  if (Q.case <= 1 && !st.done) h += `<p style="margin-top:4px;font-size:.92rem">💡 Sur le bon de livraison, tout est cliquable : le destinataire, le numéro de commande, le nombre de colis, chaque article, chaque quantité et les conditions.</p>`;
  h += `</div></div>`;
  h += `<section class="quai" aria-label="Le quai de réception"><div class="quai-head"><h3>Le quai</h3><span>${C.parcels.length} colis livrés par ${C.seller.name}</span></div><div class="parcels">`;
  C.parcels.forEach((P,k) => { h += renderParcel(C, P, k, st); });

  h += `<section class="docs"><div><div class="doclabel">Double du bon de commande <small>conservé par le magasin</small></div>${renderBC(C)}</div>
        <div><div class="doclabel">Bon de livraison <small>arrivé avec les colis</small></div>${renderBL(C, st, false)}</div></section>`;

  h += `<div class="recbar noprint"><div class="recstat"><span class="${nDone===n?'ok':''}">📦 Colis contrôlés : ${nDone} / ${n}</span><span>✍️ Réserves : ${nRes}</span><span class="${st.decision?'ok':''}">🔏 Cachet : ${st.decision ? STAMP[st.decision] : 'à apposer'}</span></div>`;
  if (st.done) h += nextBtnHTML();

  h += `</div>`;

function renderParcel(C, P, k, st){
  const s = st.parcels[k], n = C.parcels.length, z = 'parcel_' + k, i = expIdx(C, z);

  let h = `<div class="${cls}" id="parcel${k}"><div class="ptop"><b>Colis ${k+1} / ${n}</b><span class="pstate">${P.damaged ? '⚠️ ' + P.ext : 'Emballage intact'}</span></div>`;

    h += `<div class="popen">${openSVG()}<ul class="plist">` + P.items.map(it => `<li><span class="pem" aria-hidden="true">${it.e}</span><span class="pdes">${it.des}<code>${it.ref}</code></span><span class="pq">× ${it.qty}</span></li>`).join('') + `</ul>${P.note ? `<p class="pnote">${P.note}</p>` : ''}</div>`;
  } else {
    h += `<div class="pbox">${parcelSVG(!!P.damaged)}${s === 'refused' ? '<span class="refstamp">REFUSÉ</span>' : ''}</div>`;

function zoneState(C, st, z){
  const i = expIdx(C, z);
  if (st.done){ if (i >= 0) return st.lock[i]; if (st.faLog[z]) return 'fa'; return ''; }
  if (i >= 0 && isLk(st.lock[i])) return st.lock[i];
  if (st.editing === z) return 'editing';
  if (st.flags[z]) return 'flag';
  return '';
}
function zoneNote(C, st, z){
  const s = zoneState(C, st, z), i = expIdx(C, z);
  if ((s === 'flag' || s === 'editing') && st.flags[z]) return `<span class="znote flag">✍️ ${reserveText(C, z, st.flags[z])}</span>`;
  if (s === 'ok' || s === 'half') return `<span class="znote ${s}">✓ ${C.expected[i].text}</span>`;
  if (s === 'ko') return `<span class="znote ko">✏️ Correction : ${C.expected[i].text}</span>`;
  if (s === 'fa') return `<span class="znote fa">Fausse alerte : cette mention était conforme</span>`;
  return '';
}

function renderBL(C, st, ro){
  const bl = C.bl, dest = bl.dest || C.buyer, on = bl.orderNum || C.bc.num, od = bl.orderDate || C.bc.date;

  const ed = z => (!ro && !st.done && st.editing === z) ? renderEditor(C, st, z) : '';

const MARK = { ok:'✓ juste', half:'✓ au 2e essai', ko:'✗ à noter' };
function cadreLines(C, st){
  const out = [];
  const push = (z, liveText) => {
    const i = expIdx(C, z);
    if (st.done){
      if (i >= 0) out.push({ text:C.expected[i].text, cls:st.lock[i], mark:MARK[st.lock[i]] });
      else if (st.faLog[z]) out.push({ text:z.indexOf('parcel_') === 0 ? `Colis ${+z.split('_')[1] + 1} refusé` : reserveText(C, z, st.faLog[z]), cls:'fa', mark:'fausse alerte' });
    } else if (i >= 0 && isLk(st.lock[i])) out.push({ text:C.expected[i].text, cls:st.lock[i], mark:'✓' });
    else if (liveText) out.push({ text:liveText, cls:APP.justWrote === z ? 'new' : '' });
  };
  st.parcels.forEach((p,k) => push('parcel_' + k, p === 'refused' ? `Colis ${k+1} refusé : emballage endommagé` : ''));
  zoneOrder(C).forEach(z => push(z, st.flags[z] ? reserveText(C, z, st.flags[z]) : ''));
  return out;
}
function renderCadre(C, st, ro){
  const lines = cadreLines(C, st), di = decIdx(C), dl = st.lock[di];
  let h = `<div class="cadre"><div class="cadre-h"><b>Réception</b><span>À ${C.buyer.city}, le ${C.bl.date}</span></div><ul class="reserves">`;
  if (!lines.length) h += `<li class="empty">${st.done ? 'Aucune réserve.' : 'Aucune réserve notée pour l\'instant.'}</li>`;
  lines.forEach(L => { h += `<li class="${L.cls}">${L.text}${L.mark ? `<span class="rk">${L.mark}</span>` : ''}</li>`; });
  h += `</ul>`;
  if (!st.done && !ro && !isLk(dl)){
    h += `<div class="stampbar"><span>Ton cachet :</span>` + ['sans','reserve','refus'].map(d => `<button class="stampbtn s-${d} ${st.decision===d?'sel':''}" id="st_${d}" onclick="stampPick('${d}')" ${isLk(dl)?'disabled':''} aria-pressed="${st.decision===d}">${STAMP[d]}</button>`).join('') + `</div>`;
  }
  h += `<div class="stamprow"><div>`;
  if (st.decision){
    const wrong = st.done && st.decision !== C.decision;
    h += `<span class="stamp s-${st.decision} ${APP.justStamped && !ro ? 'anim' : ''} ${wrong ? 'wrongst' : ''}">${STAMP[st.decision]}</span>`;
    if (isLk(dl)) h += `<span class="stampnote" style="color:var(--${dl==='ok'?'success':'orange'})">✓ Cachet ${dl==='ok'?'juste':'juste au 2e essai'}</span>`;
  }
  if (st.done && st.decision !== C.decision){
    h += ` <span class="stamp expect s-${C.decision}">${STAMP[C.decision]}</span><span class="stampnote" style="color:var(--error)">✏️ Cachet attendu : « ${STAMP[C.decision]} »</span>`;
  }
  h += `</div><div class="sign">Signature du réceptionnaire<span class="hand">${st.decision ? esc(studentName()) : '&nbsp;'}</span></div></div></div>`;
  return h;
}

/* ---------- Actions du contrôle ---------- */
function parcelAct(k, a){
  const { st, C } = cur(); if (st.done) return;
  const i = expIdx(C, 'parcel_' + k); if (i >= 0 && isLk(st.lock[i])) return;
  if (a === 'open') st.parcels[k] = 'open';
  else if (a === 'refuse'){ st.parcels[k] = 'refused'; APP.justWrote = 'parcel_' + k; sfx('stamp'); }
  else if (a === 'undo') st.parcels[k] = 'closed';
  renderScreen();
}
function zoneClick(z){
  const { st } = cur(); if (st.done) return;

  st.editing = z;

  renderScreen();
  const t = document.getElementById(st.draftNature && NAT[st.draftNature].qty ? 'edQty' : 'ed_' + (st.draftNature || nats[0]));

function edQtyIn(v){

/* Vérification : verrouillage progressif + fausses alertes (§3.8, §3.9) */
function recCheck(){
  const { l, q, Q, st, C } = cur(); if (st.done || !recReady(st)) return;
  st.editing = null; st.attempts++; const first = st.attempts === 1;
  const expZ = new Set(C.expected.map(e => e.zone)), neutral = new Set(C.neutral);
  const fa = [];
  Object.keys(st.flags).forEach(z => { if (!expZ.has(z) && !neutral.has(z)) fa.push(z); });
  st.parcels.forEach((p,k) => { if (p === 'refused' && !expZ.has('parcel_' + k)) fa.push('parcel_' + k); });
  fa.forEach(z => { st.faLog[z] = z.indexOf('parcel_') === 0 ? { nature:'refuse' } : st.flags[z]; });
  st.penalties += fa.length;
  const els = recEls(C); let removed = 0, decReset = false;
  els.forEach((e,i) => {
    if (st.lock[i]) return;
    if (recRight(st, C, e)) st.lock[i] = first ? 'ok' : 'half';
    else if (first){
      if (e.zone === 'decision'){ st.decision = null; decReset = true; }
      else if (e.zone.indexOf('parcel_') !== 0 && st.flags[e.zone]){ delete st.flags[e.zone]; removed++; }
    } else st.lock[i] = 'ko';
  });
  if (first) fa.forEach(z => { if (z.indexOf('parcel_') === 0) st.parcels[+z.split('_')[1]] = 'closed'; else delete st.flags[z]; removed++; });
  const allRight = st.lock.every(isLk);
  if (allRight || !first){
    C.neutral.forEach(z => { delete st.flags[z]; });
    const r = elemFinish(st, Q.pts);
    st.fb = { kind:r.status === 'correct' ? 'ok' : r.status === 'hint' ? 'warn' : 'ko',
      html:`<h4>${finishFbTitle(r.status, r.earned)}</h4><p>${C.explain}</p>` +
        (st.penalties ? `<p>Fausses alertes : −${st.penalties} XP. Une réserve injustifiée fait perdre du temps au fournisseur… et ta crédibilité.</p>` : '') +
        `<p style="font-size:.9rem;color:var(--text2)">Le bon de livraison ci-dessus montre maintenant toutes les réserves attendues.</p>` };
    finishQuestion(l, q, r.status, r.earned);
  } else {
    const nRes = C.expected.filter((e,i) => st.lock[i] === 'ok').length;
    st.fb = { kind:'warn', html:`<h4>🔄 Première vérification</h4>` +
      (nRes ? `<p>✅ ${nRes} réserve${nRes>1?'s':''} juste${nRes>1?'s':''}, verrouillée${nRes>1?'s':''} en vert.</p>` : '') +
      (removed ? `<p>Les réserves retirées ne convenaient pas : soit la mention était conforme, soit la nature de l'écart ou la quantité était inexacte.</p>` : '') +
      (isLk(st.lock[decIdx(C)]) ? `<p>✅ Ton cachet est juste.</p>` : decReset ? `<p>Ton cachet a été retiré : il ne correspond pas à la situation.</p>` : '') +
      (fa.length ? `<p>Fausses alertes : −${fa.length} XP.</p>` : '') +
      `<p>Relis les colis et les documents : il peut rester une anomalie à signaler… ou un signalement à éviter.</p><p>💡 ${C.hint}</p>` };
    firstMiss();
  }
}

/* ---------- QCM ---------- */
function renderQCM(Q, st){

  Q.options.forEach((o,i) => {
    let c = 'opt';

    h += `<button class="${c}" id="o_${i}" onclick="qcmPick(${i})" ${dis?'disabled':''}><span class="ol">${'ABCD'[i]}</span><span>${o}</span></button>`;

}
function qcmPick(i){
  const { l, q, Q, st } = cur(); if (st.done || (st.wrong || []).includes(i)) return;
  st.attempts++;

    const first = st.attempts === 1;

  } else {

    finishQuestion(l, q, 'shown', 0);

}
/* ---------- Vrai / Faux (1 essai) ---------- */
function renderVF(Q, st){

function vfPick(v){

/* ---------- Sélection multiple ---------- */
function renderMulti(l, q, Q, st){

  let h = `<p class="prompt">${Q.prompt}</p><div class="opts">`;

    const o = Q.options[i], on = st.sel.includes(i); let c = 'opt' + (on ? ' sel' : '');
    if (st.done){ c = 'opt' + (o.ok && on ? ' good' : o.ok ? ' miss' : on ? ' bad' : ''); }
    h += `<button class="${c}" id="m_${i}" onclick="mToggle(${i})" ${st.done?'disabled':''} aria-pressed="${on}"><span class="chk">${on?'✓':''}</span><span>${o.t}</span></button>`;
  });
  h += `</div>` + fbHTML(st);

function mToggle(i){ const { st } = cur(); if (st.done) return; const k = st.sel.indexOf(i); if (k >= 0) st.sel.splice(k,1); else st.sel.push(i); renderScreen(); }
function mCheck(){

/* ---------- Remise en ordre ---------- */
function renderOrder(l, q, Q, st){

  st.bounced = [];

}
function oPick(i){ const { st } = cur(); if (st.done) return; const s = st.slots.findIndex((x,k) => x == null && !st.lock[k]); if (s < 0) return; st.slots[s] = i; renderScreen(); }
function oBack(s){ const { st } = cur(); if (st.done || st.lock[s]) return; st.slots[s] = null; renderScreen(); }

}
/* ---------- Classement par zones ---------- */
function renderZones(l, q, Q, st){

    Q.items.forEach((it,i) => {

function zSel(i){ const { st } = cur(); if (st.done) return; st.sel = st.sel === i ? null : i; renderScreen(); }

function matchOpts(l, q, Q){ const all = Q.pairs.map(p => p[1]).concat(Q.distract); return shuffled(all.length, l * 31 + q * 7 + 11).map(i => all[i]); }
function renderMatch(l, q, Q, st){

  if (!st.val){ st.val = Q.pairs.map(() => null); st.lock = Q.pairs.map(() => null); }
  let h = `<p class="prompt">${Q.prompt}</p>`;
  Q.pairs.forEach((p,i) => {
    const lk = st.lock[i];
    h += `<div class="mrow ${lk||''}"><span>${p[0]}</span><span><select id="ms_${i}" onchange="maSet(${i},this.value)" ${lk||st.done?'disabled':''} aria-label="Demande au fournisseur"><option value="">— Choisis une demande —</option>` +
      opts.map((o,k) => `<option value="${k}" ${st.val[i]===k?'selected':''}>${o}</option>`).join('') + `</select>${lk==='ko' ? `<span class="corr">→ ${p[1]}</span>` : ''}</span></div>`;
  });
  h += fbHTML(st);
  h += `<div class="nextbar">${st.done ? nextBtnHTML() : `<button class="btn yellow" id="maBtn" onclick="maCheck()" ${st.val.every(v => v != null)?'':'disabled'}>Vérifier</button>`}</div>`;
  return h;
}
function maSet(i, v){ const { st } = cur(); if (st.done || st.lock[i]) return; st.val[i] = v === '' ? null : +v; const b = $('maBtn'); if (b) b.disabled = !st.val.every(x => x != null); }
function maCheck(){
  const { l, q, Q, st } = cur(); if (st.done || st.val.some(v => v == null)) return;
  const opts = matchOpts(l, q, Q); st.attempts++; const first = st.attempts === 1;
  Q.pairs.forEach((p,i) => {
    if (st.lock[i]) return;
    if (opts[st.val[i]] === p[1]) st.lock[i] = first ? 'ok' : 'half';
    else if (first) st.val[i] = null;
    else st.lock[i] = 'ko';
  });
  itemsAfterCheck(l, q, Q, st, first, 'association', 'associations');
}
/* Suite commune après une vérification d'exercice à éléments */
function itemsAfterCheck(l, q, Q, st, first, one, many){
  if (st.lock.every(isLk) || !first){
    const r = elemFinish(st, Q.pts);
    st.fb = { kind:r.status === 'correct' ? 'ok' : r.status === 'hint' ? 'warn' : 'ko',
      html:`<h4>${finishFbTitle(r.status, r.earned)}</h4>${r.status === 'shown' ? `<p>Les corrections sont écrites en rouge à côté des ${many} fautives.</p>` : ''}<p>${Q.explain}</p>` };
    finishQuestion(l, q, r.status, r.earned);
  } else {
    const n = st.lock.filter(isLk).length;
    st.fb = { kind:'warn', html:`<h4>🔄 Première vérification</h4><p>✅ ${n} ${n > 1 ? many : one} sur ${st.lock.length} ${n > 1 ? 'sont justes et verrouillées' : 'est juste et verrouillée'}. Les autres sont revenues à leur place de départ : replace-les.</p><p>💡 ${Q.hint}</p>` };
    firstMiss();
  }
}

function levelStats(l){
  const L = LEVELS[l]; let c = 0, hi = 0, sh = 0, e = 0;
  L.questions.forEach((Q,q) => { const st = APP.qs[l + '_' + q]; if (st && st.done){ if (st.status === 'correct') c++; else if (st.status === 'hint') hi++; else sh++; e += st.earned; } });
  return { n:L.questions.length, correct:c, hint:hi, shown:sh, earned:e, max:L.maxPoints, ratio:L.maxPoints ? e / L.maxPoints : 0 };
}
function totalStats(){ const t = { n:0, correct:0, hint:0, shown:0 }; LEVELS.forEach((L,l) => { const s = levelStats(l); t.n += s.n; t.correct += s.correct; t.hint += s.hint; t.shown += s.shown; }); return t; }
function predCat(st){ const r = st.n ? st.correct / st.n : 0; return r === 1 ? 'all' : r >= 0.6 ? 'tq' : 'half'; }
const PREDTXT = { half:'environ la moitié', tq:'les trois quarts', all:'toutes' };
const TYPENAME = { reception:'Contrôle de réception', qcm:'QCM', vf:'Vrai ou faux', multi:'Sélection multiple', order:'Remise en ordre', zones:'Classement', match:'Appariement' };
const STICON = { correct:'✅', hint:'🔄', shown:'👁' };

function renderBilan(l){
  const L = LEVELS[l], s = levelStats(l), g = gradeOf(s.ratio);
  let h = `<div class="narrow"><section class="bil"><div class="bilhead"><span class="medal">${medal(s.ratio)}</span><div><small>Cas ${l+1} terminé — ${L.sub}</small><h2><span class="grade">${g.l}</span>${g.t}</h2><div class="stars">${stars(s.ratio)}</div><p><b>${fmt(s.earned)} / ${L.maxPoints} XP</b></p></div></div>`;
  h += `<div class="legend"><span><span class="dot g"></span>Juste du premier coup</span><span><span class="dot o"></span>Corrigé au 2e essai</span><span><span class="dot r"></span>Réponse montrée</span></div>`;
  h += `<table class="btable"><thead><tr><th>Question</th><th class="c">Résultat</th><th class="r">XP</th></tr></thead><tbody>` +
    L.questions.map((Q,q) => { const st = APP.qs[l + '_' + q] || {}; return `<tr><td>${TYPENAME[Q.type]}</td><td class="c">${STICON[st.status] || '—'}</td><td class="r">${fmt(st.earned || 0)} / ${Q.pts}</td></tr>`; }).join('') +

  const p = APP.pred[l];
  if (p){
    const real = predCat(s), ord = { half:0, tq:1, all:2 };
    const msg = real === p ? 'Bonne estimation : tu te connais bien !' : ord[real] > ord[p] ? 'Tu as fait mieux que prévu : fais-toi confiance !' : 'Un peu optimiste cette fois : regarde ce qui t\'a échappé dans le bon de livraison ci-dessous.';
    h += `<div class="predline">🔮 Tu avais prédit <b>${PREDTXT[p]}</b> ; tu as réussi <b>${s.correct} / ${s.n}</b> du premier coup. ${msg}</div>`;

      <div class="fiche"><p style="font-size:.85rem;color:var(--text2);margin-bottom:6px">Contrôle réalisé par <b>${esc(studentName())}</b> le ${today()} — application « Le bon de livraison »</p>${renderBL(C, st, true)}</div></div>`;

}

function bilanIndicateurs(){
  const acc = {};
  const add = (ind, pts, max) => { const a = acc[ind] || (acc[ind] = { pts:0, max:0 }); a.pts += pts; a.max += max; };
  LEVELS.forEach((L,l) => L.questions.forEach((Q,q) => {
    const st = APP.qs[l + '_' + q], defs = elemDefs(Q);
    if (defs){
      const ee = st && st.done && st.elemEarned ? st.elemEarned : defs.map(() => 0);
      const sum = ee.reduce((a,b) => a + b, 0), f = sum > 0 ? st.earned / sum : 0;   // fausses alertes réparties
      defs.forEach((d,i) => add(d.ind, ee[i] * f, d.max));
    } else add(Q.ind, st && st.done ? st.earned : 0, Q.pts);
  }));
  const statut = r => r >= 0.8 ? 'atteint' : r >= 0.5 ? 'encours' : 'nonatteint';
  return CRITERES.map(c => {
    const inds = c.indicateurs.map(ind => { const a = acc[ind.id] || { pts:0, max:0 }; const r = a.max ? a.pts / a.max : 0; return Object.assign({}, ind, { ratio:r, statut:statut(r) }); });
    const tot = c.indicateurs.reduce((t,ind) => { const a = acc[ind.id] || { pts:0, max:0 }; return { pts:t.pts + a.pts, max:t.max + a.max }; }, { pts:0, max:0 });
    const r = tot.max ? tot.pts / tot.max : 0;
    return { id:c.id, nom:c.nom, ratio:r, statut:statut(r), indicateurs:inds };
  });
}
const STLAB = { atteint:'✅ Atteint', encours:'🟠 En cours d\'acquisition', nonatteint:'❌ Non atteint' };

  h += `<div class="finalgrid"><div class="fstat"><b>${fmt(APP.score)} / ${TOTAL_XP}</b><small>XP gagnés</small></div><div class="fstat"><b>${R.icon} ${R.name}</b><small>Rang atteint</small></div><div class="fstat"><b>🔥 ${APP.bestStreak}</b><small>Meilleure série</small></div><div class="fstat"><b>🏅 ${APP.badges.size} / ${BADGES.length}</b><small>Badges</small></div></div>`;
  h += `<div class="legend"><span><span class="dot g"></span>Juste du premier coup</span><span><span class="dot o"></span>Corrigé au 2e essai</span><span><span class="dot r"></span>Réponse montrée</span></div>`;
  h += `<table class="btable"><thead><tr><th>Cas</th><th class="c">✅</th><th class="c">🔄</th><th class="c">👁</th><th class="c">Étoiles</th><th class="r">XP</th></tr></thead><tbody>` +
    LEVELS.map((L,l) => { const s = levelStats(l); return `<tr><td>${L.icon} ${L.title}</td><td class="c">${s.correct}</td><td class="c">${s.hint}</td><td class="c">${s.shown}</td><td class="c stars">${stars(s.ratio)}</td><td class="r">${fmt(s.earned)} / ${L.maxPoints}</td></tr>`; }).join('') + `</tbody></table>`;
  h += `<h3 class="section-t">📋 Ce que tu maîtrises</h3>`;

      if (i.statut !== 'atteint'){ allOk = false; h += `<div class="rev">📖 À revoir dans ton cours : « ${i.chapitre} »${i.partie ? `, partie « ${i.partie} »` : ''} — ${i.revoir}</div>`; }
    });
    h += `</div>`;
  });
  if (allOk) h += `<div class="allok">🎉 Tous les objectifs sont atteints : tu sais contrôler une livraison et réagir face à une anomalie. Passe aux exercices papier pour aller plus loin.</div>`;
  h += `<div class="row noprint" style="margin-top:16px"><button class="btn ghost" onclick="window.print()">🖨️ Imprimer mon bilan</button>${lbButtons()}<button class="btn yellow" id="replayBtn" onclick="replay()">🔁 Rejouer</button></div></section>`;
  return h;
}

function checkBadges(){
  const got = id => {
    if (APP.badges.has(id)) return; APP.badges.add(id);
    const b = BADGES.find(x => x.id === id);
    queueToast(`<span class="ti">${b.icon}</span><div><b>Badge débloqué : ${b.name}</b><small>${b.cond}</small></div>`); sfx('badge');
  };
  if (APP.completed.has(0)) got('first');
  const s0 = APP.qs['0_0']; if (s0 && s0.done && !s0.penalties) got('calm');
  const s2 = APP.qs['2_0']; if (s2 && s2.done && s2.lock && s2.lock[0] === 'ok') got('bc');
  const s4 = APP.qs['4_0']; if (s4 && s4.done && s4.lock){ const i = expIdx(CASES[4], 'parcel_3'); if (s4.lock[i] === 'ok') got('refuse'); }
  if (APP.bestStreak >= 5) got('streak5');
  LEVELS.forEach((L,l) => { if (!APP.completed.has(l)) return; const s = levelStats(l); if (s.earned >= L.maxPoints) got('perfect'); if (APP.pred[l] && predCat(s) === APP.pred[l]) got('predict'); });
  if (APP.completed.size === LEVELS.length) got('boss');
}

function particles(x, y){

let AC = null;
function tone(f, start, dur, type, vol){
  if (!APP.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + start;
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(vol || 0.07, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch(e){}
}
function sfx(k){
  if (!APP.sound) return;
  if (k === 'good'){ tone(660,0,.12); tone(990,.1,.16); }
  else if (k === 'bad') tone(220,0,.18,'triangle',.05);
  else if (k === 'badge'){ tone(784,0,.12); tone(988,.1,.12); tone(1319,.2,.22); }
  else if (k === 'level') [523,659,784,1047].forEach((f,i) => tone(f, i * .1, .18));
  else if (k === 'stamp') tone(130,0,.09,'square',.04);
  else if (k === 'tick') tone(880,0,.05,'sine',.04);
}
function toggleSound(){
  APP.sound = !APP.sound; const b = $('hSound');
  b.textContent = APP.sound ? '🔊' : '🔇'; b.setAttribute('aria-label', APP.sound ? 'Couper le son' : 'Activer le son');
  if (APP.sound) sfx('tick');
}

  currentLBTab = tab;
  const a = $('lbTabApp'), g = $('lbTabGlobal');
  if (tab === 'app'){ a.style.background = 'var(--success)'; a.style.color = '#fff'; g.style.background = 'transparent'; g.style.color = 'var(--orange)'; }
  else { g.style.background = 'var(--orange)'; g.style.color = '#fff'; a.style.background = 'transparent'; a.style.color = 'var(--success)'; }
  fetchLeaderboard(tab);
}
function fetchLeaderboard(tab){
  const content = $('lbContent');
  content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2);">⏳ Chargement…</div>';
  const action = tab === 'app' ? 'leaderboard_app' : 'leaderboard_global';
  const cbName = '_lbCb_' + Date.now();
  const timeout = setTimeout(() => {
    delete window[cbName]; const s = document.getElementById(cbName); if (s) s.remove();
    content.innerHTML = '<div style="text-align:center;padding:40px;"><div style="color:var(--error);margin-bottom:12px;">⚠️ Connexion impossible</div><button class="btn sm ghost" onclick="fetchLeaderboard(\'' + tab + '\')">Réessayer</button></div>';
  }, 10000);
  window[cbName] = function(resp){
    clearTimeout(timeout); delete window[cbName];
    const s = document.getElementById(cbName); if (s) s.remove();
    const lbData = resp && (resp.leaderboard || resp.data);
    if (!lbData || lbData.length === 0){ content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2);">🏁 Aucun résultat pour le moment</div>'; return; }
    renderLeaderboard(lbData, tab);
  };
  let url = `${TRACKING.scriptUrl}?action=${action}&callback=${cbName}&mode=last`;
  if (tab === 'app') url += `&app=${encodeURIComponent(TRACKING.appName)}`;
  if (APP.classe) url += `&classe=${encodeURIComponent(APP.classe)}`;
  const sc = document.createElement('script'); sc.id = cbName; sc.src = url;
  sc.onerror = () => { clearTimeout(timeout); delete window[cbName]; sc.remove(); content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--error);">⚠️ Erreur de connexion</div>'; };
  document.body.appendChild(sc);
}
function renderLeaderboard(data, tab){
  const content = $('lbContent'), myEmail = (APP.email || '').toLowerCase();
  if (tab === 'global' && data.length > 0){
    data = data.slice().sort((a,b) => { const pa = a.pct || 0, pb = b.pct || 0; if (pb !== pa) return pb - pa; return (a.totalTemps || 0) - (b.totalTemps || 0); });
    data.forEach((e,i) => { e.rang = i + 1; });
  }
  const pcol = p => p >= 80 ? 'var(--success)' : p >= 50 ? 'var(--orange)' : 'var(--error)';
  const title = tab === 'app' ? '🏆 Classement — ' + TRACKING.appName : '🌍 Classement général';
  let html = `<h3 style="margin-bottom:12px;font-size:1.1rem">${title}${APP.classe ? ' (' + esc(APP.classe) + ')' : ''}</h3>`;
  const me = data.find(r => r.email === myEmail);
  if (me){
    const pct = me.pct != null ? me.pct : (me.pourcentage != null ? me.pourcentage : 0);
    const count = tab === 'app' ? (me.niveauxCompletes || me.niveaux || 0) : (me.appsCompletes || me.apps || 0);
    const total = tab === 'app' ? (me.totalNiveaux || 0) : (me.totalPossibleNiveaux || 0);
    const label = tab === 'app' ? 'niveaux' : 'apps';
    const prog = total > 0 ? count + '/' + total + ' ' + label : count + ' ' + label;
    html += `<div style="background:var(--okbg);border:1px solid var(--okbd);border-radius:12px;padding:14px;margin-bottom:14px;display:flex;justify-content:space-around;text-align:center;gap:8px;flex-wrap:wrap">
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--success)">#${me.rang}</div><div style="font-size:.72rem;color:var(--text2)">Rang</div></div>
      <div><div style="font-size:1.3rem;font-weight:800">${me.totalPoints}</div><div style="font-size:.72rem;color:var(--text2)">Points</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:${pcol(pct)}">${pct}%</div><div style="font-size:.72rem;color:var(--text2)">Réussite</div></div>
      <div><div style="font-size:1.1rem;font-weight:800;color:var(--text2)">${prog}</div><div style="font-size:.72rem;color:var(--text2)">Progression</div></div></div>`;
  }
  const medals = ['🥇','🥈','🥉'];
  html += '<table class="btable"><thead><tr><th>#</th><th>Élève</th><th class="r">Pts</th><th class="r">%</th><th class="r">Temps</th></tr></thead><tbody>';
  data.forEach(row => {
    const r = row.rang || 0;
    const name = String(row.email || '').split('@')[0].split(/[._-]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    const pct = row.pct != null ? row.pct : (row.pourcentage != null ? row.pourcentage : 0);
    const temps = row.totalTemps || row.totalTime || 0, isMe = row.email === myEmail;
    let tStr = '—'; if (temps > 0){ const m = Math.floor(temps / 60), s = temps % 60; tStr = m > 0 ? m + 'm' + String(s).padStart(2,'0') + 's' : s + 's'; }
    html += `<tr style="background:${isMe ? 'var(--okbg)' : 'transparent'}"><td><b>${r <= 3 ? medals[r-1] : r}</b></td><td style="${isMe ? 'font-weight:800;color:var(--success)' : ''}">${esc(name)}</td><td class="r"><b>${row.totalPoints}</b></td><td class="r" style="font-weight:700;color:${pcol(pct)}">${pct}%</td><td class="r mono" style="font-size:.8rem;color:var(--text2)">${tStr}</td></tr>`;
  });
  html += '</tbody></table>';
  content.innerHTML = html;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('lbOverlay').classList.contains('show')) closeLB(); });

   15. LANCEMENT
   ================================================================= */
function init(){
  buildXPMarks();
  document.addEventListener('pointerdown', e => { APP.lastXY = { x:e.clientX, y:e.clientY }; }, true);
  renderScreen();
  showEmailModal();   // toujours, même si un email est mémorisé (SPEC §7.4)
}
init();
</script>
